name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  lint-powershell:
    name: PSScriptAnalyzer
    # runs-on: windows-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # old, slow way of getting the latest version of powershell on windows
      # - name: Install latest PowerShell
      #   uses: PSModule/install-powershell@v1
      #   with:
      #     Version: 7.6.2

      # new, faster, recommended way of getting latest version of powershell on windows
      # - name: Install Stable PowerShell 7.6 via WinGet
      #   run: |
      #     winget install --id Microsoft.PowerShell --source winget --exact --silent --accept-source-agreements --accept-package-agreements
        # Pulls the official cryptographically signed 7.6 package from Microsoft

      # old way of getting latest version of powershell on ubuntu
      # REMOVE THIS STEP AFTER JUNE 15, 2026 once 7.6 rolls out globally
      - name: Install Stable PowerShell 7.6 via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run lint
        shell: pwsh
        run: ./tools/Run-PowerShellLint.ps1

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./Sage/Sage.psd1

  lint-markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !legacy/**

  unit-tests:
    name: Unit Tests
    # runs-on: windows-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # old, slow way of getting the latest version of powershell on windows
      # - name: Install latest PowerShell
      #   uses: PSModule/install-powershell@v1
      #   with:
      #     Version: 7.6.2

      # new, faster, recommended way of getting latest version of powershell on windows
      # - name: Install Stable PowerShell 7.6 via WinGet
      #   run: |
      #     winget install --id Microsoft.PowerShell --source winget --exact --silent --accept-source-agreements --accept-package-agreements
        # Pulls the official cryptographically signed 7.6 package from Microsoft

      # old way of getting latest version of powershell on ubuntu
      # REMOVE THIS STEP AFTER JUNE 15, 2026 once 7.6 rolls out globally
      - name: Install Stable PowerShell 7.6 via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -AllowClobber

      - name: Install SecretManagement
        shell: pwsh
        run: Install-Module -Name Microsoft.PowerShell.SecretManagement -Scope CurrentUser -Force -AllowClobber

      - name: Run unit tests
        shell: pwsh
        run: ./tools/Run-Tests.ps1

